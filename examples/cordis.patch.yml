# 示例：DSH profile 的 cordis.patch.yml 里要追加的插件配置
# 位置：%USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml
# 把下面这段追加到文件末尾（注意缩进，config 与 id 同级）
# 替换掉所有 <占位符> 后再保存，改完必须重启 DSH

- id: dsh-onebot
  config:
    mode: reverse                      # reverse = NapCat 连过来（推荐）
    host: 127.0.0.1                    # 跨机部署才改 0.0.0.0
    port: 8643                         # NapCat 侧 url 要指向这个端口
    accessToken: '<accessToken>'       # reverse 模式必填，须与 NapCat 一致
    botQQ: '<机器人QQ号>'
    adminUsers:                        # 至少一个，否则谁都用不了
      - '<机器人QQ号>'
      - '<你自己的QQ号>'
    dmPolicy: open                     # open = 只有 adminUsers 能私聊
    groupPolicy: disabled              # disabled = 群里完全不理人
    requireMention: true               # 群聊需 @；私聊无效
    rateLimitPerMinute: 30
    dedupWindowSeconds: 300
    textImageThreshold: 150
    traceEnabled: true                 # 排障必开
    traceLevel: debug
    recordInbound: true
